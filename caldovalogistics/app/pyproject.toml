[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caldova-logistics"
version = "0.1.0"
description = "Caldova Logistics control tower demonstration for Azure HorizonDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["caldova_logistics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
