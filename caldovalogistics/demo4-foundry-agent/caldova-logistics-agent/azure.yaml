# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: caldova-logistics-agent
services:
    caldova-logistics-agent:
        project: src/agent-framework-agent-basic-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            CALDOVA_MCP_URL: ${CALDOVA_MCP_URL}
            CALDOVA_MCP_FUNCTION_KEY: ${CALDOVA_MCP_FUNCTION_KEY}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A governed Caldova Logistics operations agent using remote MCP tools and HorizonDB authorization.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: caldova-logistics-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: caldova-agent-chat
              sku:
                capacity: 100
                name: GlobalStandard
infra:
    provider: microsoft.foundry
