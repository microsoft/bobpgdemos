[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caldova-logistics-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["caldova_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]