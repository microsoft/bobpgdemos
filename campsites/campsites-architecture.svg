<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Find your next escape: container to Azure architecture</title>
  <desc id="description">One-time migration from a local Docker PostgreSQL database through pg_dump and pg_restore to Azure Database for PostgreSQL Flexible Server. The live browser app calls a Node.js Express API on Azure App Service, which connects to the migrated database using managed identity, Microsoft Entra tokens, and certificate-verified TLS. PostgreSQL powers geographic search, full-text search, JSONB filters, typo tolerance, and concurrency-safe reservations. OpenStreetMap supplies browser map tiles independently of database queries. Production and staging share the same database.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#091321"/>
      <stop offset="1" stop-color="#111d30"/>
    </linearGradient>
    <linearGradient id="cloud" x2="1" y2="1">
      <stop stop-color="#102c41"/>
      <stop offset="1" stop-color="#13243a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#58d9c0"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#74b9ff"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #edf4ff; }
      .muted { fill: #b4c5db; }
      .teal { fill: #58d9c0; }
      .blue { fill: #74b9ff; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 29px; font-weight: 650; }
      .body { font-size: 23px; }
      .small { font-size: 20px; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 20px; fill: #bcece1; }
      .card { fill: #142237; stroke: #34475f; stroke-width: 1.5; }
      .flow { fill: none; stroke: #58d9c0; stroke-width: 3; marker-end: url(#arrow); }
      .runtime { fill: none; stroke: #74b9ff; stroke-width: 3; marker-end: url(#blue-arrow); }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect x="48" y="46" width="6" height="73" rx="3" fill="#58d9c0"/>
  <text x="76" y="85" font-size="48" font-weight="700">Find your next escape</text>
  <text x="78" y="119" class="body muted">From a PostgreSQL container to Azure. Same database features. A live, map-driven app.</text>
  <rect x="1514" y="56" width="358" height="46" rx="23" fill="#173549" stroke="#39687a"/>
  <text x="1693" y="86" text-anchor="middle" class="small teal">POSTGRESQL PORTABILITY</text>

  <text x="48" y="176" class="eyebrow teal">01 / ONE-TIME DATABASE MIGRATION</text>
  <text x="1872" y="176" text-anchor="end" class="small muted">Dump / restore, not continuous replication</text>

  <rect x="48" y="198" width="460" height="214" rx="18" class="card"/>
  <g fill="none" stroke="#74b9ff" stroke-width="2">
    <rect x="74" y="228" width="18" height="14" rx="2"/>
    <rect x="97" y="228" width="18" height="14" rx="2"/>
    <rect x="120" y="228" width="18" height="14" rx="2"/>
    <rect x="97" y="209" width="18" height="14" rx="2"/>
    <path d="M72 249 H144 Q141 268 115 268 H96 Q76 268 72 249 Z"/>
  </g>
  <text x="162" y="241" class="heading">Local Docker container</text>
  <text x="76" y="289" class="body">PostgreSQL 18.6 + PostGIS</text>
  <text x="76" y="326" class="code">localhost:55432 / campsites</text>
  <text x="76" y="365" class="small muted">30 fictional campsites + seed reservations</text>
  <text x="76" y="392" class="small muted">Persistent volume; source preserved</text>

  <path d="M508 300 H662" class="flow"/>
  <text x="585" y="280" text-anchor="middle" class="code">pg_dump</text>
  <text x="585" y="332" text-anchor="middle" class="small muted">custom format</text>

  <rect x="674" y="198" width="430" height="214" rx="18" class="card"/>
  <text x="702" y="241" class="heading">Portable database archive</text>
  <text x="702" y="284" class="body">Schema + data + indexes</text>
  <text x="702" y="318" class="body">Constraints + identity sequences</text>
  <path d="M702 340 H1076" stroke="#34475f"/>
  <text x="702" y="369" class="small teal">Preflight: match engine + extensions</text>
  <text x="702" y="396" class="small muted">Allowlist all source extensions on Azure</text>

  <path d="M1104 300 H1258" class="flow"/>
  <text x="1186" y="280" text-anchor="middle" class="code">pg_restore</text>
  <text x="1186" y="332" text-anchor="middle" class="small muted">Entra + TLS</text>

  <rect x="1270" y="198" width="602" height="214" rx="18" fill="url(#cloud)" stroke="#458d9e" stroke-width="1.5"/>
  <text x="1298" y="241" class="heading">Azure Database for PostgreSQL</text>
  <text x="1298" y="280" class="body teal">Flexible Server / PostgreSQL 18.6</text>
  <text x="1298" y="316" class="code">bobward-campsites-pg18 / campsites</text>
  <text x="1298" y="353" class="small muted">Verify fingerprints, counts, sequences + queries</text>
  <text x="1298" y="389" class="small teal">Already migrated; do not overwrite the live target</text>

  <text x="48" y="476" class="eyebrow blue">02 / LIVE APPLICATION REQUEST FLOW</text>
  <text x="1872" y="476" text-anchor="end" class="small muted">Azure Central US / campsites-demo-rg</text>

  <rect x="48" y="504" width="390" height="252" rx="18" class="card"/>
  <text x="76" y="548" class="heading">Browser experience</text>
  <text x="76" y="590" class="body">Search + map + availability</text>
  <text x="76" y="626" class="body">Typo lookup + fictional bookings</text>
  <text x="76" y="662" class="small blue">Debug: SQL + bound parameters</text>
  <path d="M76 683 H410" stroke="#34475f"/>
  <text x="76" y="711" class="small muted">Leaflet renders PostGIS coordinates</text>
  <text x="76" y="738" class="small muted">OpenStreetMap tiles via internet</text>

  <path d="M438 602 H558" class="runtime"/>
  <text x="500" y="582" text-anchor="middle" class="small blue">HTTPS</text>
  <path d="M570 659 H450" fill="none" stroke="#74b9ff" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text x="500" y="689" text-anchor="middle" font-size="18" class="muted">JSON + SQL</text>

  <rect x="570" y="504" width="555" height="252" rx="18" class="card"/>
  <text x="598" y="548" class="heading">Azure App Service</text>
  <text x="598" y="586" class="body">Node.js 24 / Express / TypeScript</text>
  <text x="598" y="621" class="small muted">Validated REST API + parameterized SQL</text>
  <text x="598" y="654" class="small blue">Managed identity → Microsoft Entra token</text>
  <text x="598" y="686" class="small muted">node-postgres pool / scoped database roles</text>
  <text x="598" y="727" class="small muted">Production + staging share one demo database</text>

  <path d="M1125 602 H1258" class="runtime"/>
  <text x="1197" y="568" text-anchor="middle" font-size="18" class="blue">Verified TLS</text>
  <text x="1197" y="590" text-anchor="middle" font-size="18" class="blue">TCP 5432</text>
  <path d="M1270 659 H1137" fill="none" stroke="#74b9ff" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text x="1197" y="689" text-anchor="middle" font-size="18" class="muted">Rows / receipt</text>

  <rect x="1270" y="504" width="602" height="252" rx="18" fill="url(#cloud)" stroke="#458d9e" stroke-width="1.5"/>
  <text x="1298" y="548" class="heading">The migrated PostgreSQL database</text>
  <text x="1298" y="590" class="code">escape.campsite</text>
  <text x="1298" y="622" class="small muted">Geography, descriptions, capacity + amenities</text>
  <text x="1298" y="660" class="code">escape.reservation</text>
  <text x="1298" y="692" class="small muted">Date ranges + atomic overlap protection</text>
  <text x="1298" y="734" class="small teal">Search, filter and booking rules run in PostgreSQL</text>

  <text x="48" y="814" class="eyebrow teal">03 / POSTGRESQL FEATURES THAT POWER THE EXPERIENCE</text>
  <path d="M1572 756 V791 H1503" fill="none" stroke="#458d9e" stroke-width="2"/>

  <rect x="48" y="838" width="350" height="172" rx="16" class="card"/>
  <rect x="48" y="855" width="4" height="38" rx="2" fill="#58d9c0"/>
  <text x="70" y="877" font-size="25" font-weight="650">PostGIS</text>
  <text x="70" y="914" class="small">Nearby campsites + map points</text>
  <text x="70" y="949" class="code">ST_DWithin / ST_Distance</text>
  <text x="70" y="984" class="small muted">Geography + GiST index</text>

  <rect x="416" y="838" width="350" height="172" rx="16" class="card"/>
  <rect x="416" y="855" width="4" height="38" rx="2" fill="#74b9ff"/>
  <text x="438" y="877" font-size="25" font-weight="650">Full-text search</text>
  <text x="438" y="914" class="small">Search "lake kayaking"</text>
  <text x="438" y="949" class="code">tsvector + tsquery</text>
  <text x="438" y="984" class="small muted">Weighted document + GIN index</text>

  <rect x="784" y="838" width="350" height="172" rx="16" class="card"/>
  <rect x="784" y="855" width="4" height="38" rx="2" fill="#baadff"/>
  <text x="806" y="877" font-size="25" font-weight="650">JSONB amenities</text>
  <text x="806" y="914" class="small">Pet-friendly? Kayak rentals?</text>
  <text x="806" y="949" class="code">amenities @&gt; {...}</text>
  <text x="806" y="984" class="small muted">Flexible attributes + GIN index</text>

  <rect x="1152" y="838" width="350" height="172" rx="16" class="card"/>
  <rect x="1152" y="855" width="4" height="38" rx="2" fill="#ffcd85"/>
  <text x="1174" y="877" font-size="25" font-weight="650">pg_trgm typo tolerance</text>
  <text x="1174" y="914" class="small">"Samamish" → "Sammamish"</text>
  <text x="1174" y="949" class="code">% / similarity()</text>
  <text x="1174" y="984" class="small muted">Trigram matching + GIN index</text>

  <rect x="1520" y="838" width="352" height="172" rx="16" class="card"/>
  <rect x="1520" y="855" width="4" height="38" rx="2" fill="#ff9fae"/>
  <text x="1542" y="877" font-size="25" font-weight="650">No double booking</text>
  <text x="1542" y="914" class="small">daterange [arrival, departure)</text>
  <text x="1542" y="949" class="code">EXCLUDE USING gist</text>
  <text x="1542" y="984" class="small muted">btree_gist / conflict → HTTP 409</text>

  <text x="48" y="1052" class="small muted">Same PostgreSQL schema and query logic after migration; cloud identities and permissions are configured separately.</text>
  <text x="1872" y="1052" text-anchor="end" font-size="17" class="muted">Fictional demo / not a production HA design</text>
</svg>
